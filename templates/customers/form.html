{% extends "base.html" %}
{% block title %}{{ title }} | ITGenius Billing{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-9"><div class="card"><div class="card-header"><h4 class="mb-0">{{ title }}</h4></div><div class="card-body"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Save</button> <a href="{% url 'customer_list' %}" class="btn btn-secondary">Cancel</a></form></div></div></div></div>
{% endblock %}
