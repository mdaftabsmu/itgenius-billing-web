<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ITGenius Billing{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">ITGenius Billing</a>
        {% if request.user.is_authenticated %}
        <div class="navbar-nav ms-auto"><a class="nav-link" href="/customers/">Customers</a><a class="nav-link" href="/admin/">Admin</a></div>
        {% endif %}
    </div>
</nav>
<main class="container py-4">
{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
