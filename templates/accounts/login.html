{% extends "base.html" %}
{% block title %}Login | ITGenius Billing{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-1">ITGenius Billing</h2>
                    <p class="text-muted mb-0">Sign in to your account</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Login</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold"> Create one</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
